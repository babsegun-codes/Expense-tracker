name: Expense-tracker CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-backend:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.build-backend.outputs.sha }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Test backend
        working-directory: ./backend
        run: npm test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_EXPENSE }}
          password: ${{ secrets.DOCKER_PASSWORD_EXPENSE }}

      - name: Determine image tag
        id: build-backend
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: samakn/expense-tracker:backend-${{ steps.build-backend.outputs.sha }}

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: samakn/expense-tracker:backend-${{ steps.build-backend.outputs.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'


  build-frontend:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.build-frontend.outputs.sha }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_EXPENSE }}
          password: ${{ secrets.DOCKER_PASSWORD_EXPENSE }}

      - name: Determine image tag
        id: build-frontend
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: samakn/expense-tracker:frontend-${{ steps.build-frontend.outputs.sha }}

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: samakn/expense-tracker:frontend-${{ steps.build-frontend.outputs.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'





  deploy:
    name: Deploy to EKS
    needs:
      - build-backend
      - build-frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name expense-tracker

      - name: Update backend image
        run: |
          sed -i \
            "s|image: samakn/expense-tracker:backend.*|image: samakn/expense-tracker:backend-${{ needs.build-backend.outputs.sha }}|" \
            Kubernetes/backend-deployment.yaml

      - name: Update frontend image
        run: |
          sed -i \
            "s|image: samakn/expense-tracker:frontend.*|image: samakn/expense-tracker:frontend-${{ needs.build-frontend.outputs.sha }}|" \
            Kubernetes/frontend-deployment.yaml

      - name: Deploy Kubernetes resources
        run: |
          kubectl apply -f Kubernetes/backend-deployment.yaml
          kubectl apply -f Kubernetes/frontend-deployment.yaml
          kubectl apply -f Kubernetes/backend-service.yaml
          kubectl apply -f Kubernetes/frontend-service.yaml
          kubectl apply -f Kubernetes/expense-ingress.yaml
          kubectl apply -f Kubernetes/backend-hpa.yaml

      - name: Wait for backend rollout
        run: |
          kubectl rollout status \
            deployment/backend-deployment \
            -n expense-tracker \
            --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status \
            deployment/frontend-deployment \
            -n expense-tracker \
            --timeout=180s