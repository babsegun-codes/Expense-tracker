services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4600:4500"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4500
      MONGODB_URI: mongodb://mongodb:mongopassword@mongo:27017/expense_tracker?authSource=admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4500/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4600/api
    restart: unless-stopped
    ports:
      - "801:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
