deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 168h

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    delete_request_store: filesystem

singleBinary:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp2
    size: 5Gi

gateway:
  enabled: true
  replicas: 1

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false

backend:
  enabled: false
  replicas: 0

read:
  enabled: false
  replicas: 0

write:
  enabled: false
  replicas: 0

compactor:
  enabled: false

test:
  enabled: false
