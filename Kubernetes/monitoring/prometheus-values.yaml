
scrapeConfigs:
  prometheus:
    enabled: false
  
alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false


prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: true
    storageClass: gp2
    size: 8Gi

serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
    scrape_configs: 
    
      - job_name: expense-tracker-backend
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets:
            - backend-service.expense-tracker.svc.cluster.local:4500